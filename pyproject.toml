[project]
name = "jane-app-mcp"
version = "1.1.0"
description = "Connect Jane App to Claude Code, ChatGPT and any AI agent through Cotlet.dev, a hosted MCP server. No Jane App API key needed."
readme = "README.md"
license = "Elastic-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Cotlet.dev", email = "contact@cotlet.dev" }]
keywords = ["jane app", "jane app api", "jane app mcp", "mcp server", "claude", "chatgpt", "ai agent", "cotlet"]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Office/Business"]
dependencies = []

[project.urls]
Homepage = "https://cotlet.dev/integrations/jane-app-api-mcp-server?utm_source=pypi&utm_medium=package&utm_campaign=jane-app"
Source = "https://github.com/cotlet-connect/jane-app-mcp"

[project.scripts]
jane-app-mcp = "jane_app_agent:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.force-include]
"jane_app_agent.py" = "jane_app_agent.py"

[tool.hatch.build.targets.sdist]
include = ["jane_app_agent.py", "README.md", "LICENSE", "mcp.json", "Dockerfile", "glama.json", "skills", "examples", ".cursor"]
